{
  "name": "Oaktree-vahti",
  "on": {
    "schedule": [{ "cron": "*/10 * * * *" }],
    "workflow_dispatch": {}
  },
  "permissions": { "contents": "write" },
  "concurrency": { "group": "oaktree-vahti", "cancel-in-progress": false },
  "jobs": {
    "tarkista": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "steps": [
        { "uses": "actions/checkout@v4" },
        { "uses": "actions/setup-python@v5", "with": { "python-version": "3.12" } },
        {
          "name": "Aja tarkistus",
          "env": {
            "SEC_USER_AGENT": "${{ secrets.SEC_USER_AGENT }}",
            "NTFY_TOPIC": "${{ secrets.NTFY_TOPIC }}"
          },
          "run": "python oaktree_vahti.py --once"
        },
        {
          "name": "Tallenna tila",
          "if": "always()",
          "run": "cp oaktree_state.json /tmp/tila.json 2>/dev/null || true; git config user.name oaktree-vahti && git config user.email oaktree-vahti@users.noreply.github.com && git fetch origin main && git reset --hard origin/main && (cp /tmp/tila.json oaktree_state.json 2>/dev/null || true) && (git add oaktree_state.json || true) && (git diff --cached --quiet || (git commit -m 'Paivita tila' && git push))"
        }
      ]
    }
  }
}
