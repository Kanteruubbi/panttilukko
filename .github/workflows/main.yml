name: Oaktree-vahti

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oaktree-vahti
  cancel-in-progress: false

jobs:
  tarkista:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aja tarkistus
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python oaktree_vahti.py --once

      - name: Tallenna tila
        if: always()
        run: |
          git config user.name "oaktree-vahti"
          git config user.email "oaktree-vahti@users.noreply.github.com"
          git add oaktree_state.json || true
          git diff --cached --quiet || (git commit -m "Päivitä tila" && git push)
